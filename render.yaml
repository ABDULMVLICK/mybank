# Infrastructure décrite dans le code (« Blueprint » Render) : un service web Docker + une base PostgreSQL.
# autoDeploy est désactivé : c'est GitHub Actions qui déclenche le déploiement, et seulement si la CI est verte.
services:
  - type: web
    name: mybank
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: false
    healthCheckPath: /api/sante
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mybank-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render génère un secret aléatoire, jamais écrit dans le code
      - key: COOKIE_SECURE
        value: "true" # le site est servi en HTTPS
      - key: TRUST_PROXY
        value: "true" # Render est un reverse proxy
      - key: INIT_BASE
        value: "true" # crée les tables au premier démarrage
      - key: ADMIN_MOT_DE_PASSE
        sync: false # à saisir dans le tableau de bord Render, jamais dans Git
      - key: MONGO_URL
        sync: false # facultatif : MongoDB Atlas gratuit ; sans lui, le journal est désactivé

databases:
  - name: mybank-db
    plan: free
    databaseName: mybank
    user: mybank
