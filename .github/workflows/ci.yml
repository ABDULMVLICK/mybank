# Intégration et déploiement continus.
# CI : à chaque push et pull request, on vérifie, on teste, puis on construit les images.
# CD : sur la branche main uniquement, si tout est vert, on déploie sur Railway puis on vérifie le site en ligne.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mybank
          POSTGRES_PASSWORD: mybank
          POSTGRES_DB: mybank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mybank"
          --health-interval 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://mybank:mybank@localhost:5432/mybank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # tests unitaires + tests d'intégration sur la base PostgreSQL du service

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend] # ne construit les images que si tous les tests passent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build # images de développement (Nginx + API)
      - run: docker build -t mybank-production . # image de production déployée sur Railway

  deploy:
    needs: [docker] # jamais de déploiement si un test ou une construction a échoué
    # Sauté tant que Railway n'est pas configuré (variable APP_URL absente) : la CI reste verte.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }} # jeton du projet Railway, jamais dans le code
    steps:
      - uses: actions/checkout@v4
      - name: Installer la CLI Railway
        run: npm install -g @railway/cli
      - name: Déployer sur Railway
        # Envoie le code, Railway construit le Dockerfile ; --ci attend la fin et échoue si le build échoue.
        run: railway up --service mybank --ci
      - name: Vérifier que le site en ligne répond
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.APP_URL }}/api/sante"; then exit 0; fi
            sleep 15
          done
          echo "Le site ne répond pas après le déploiement." && exit 1
