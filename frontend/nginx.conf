server {
  listen 80;
  root /usr/share/nginx/html;

  # Les appels /api partent vers le conteneur de l'API : même origine pour le navigateur.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Application React : toutes les autres adresses renvoient index.html.
  location / {
    try_files $uri /index.html;
  }
}
